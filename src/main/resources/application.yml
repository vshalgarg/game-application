spring:
  application:
    name: game-service

  datasource:
    url: jdbc:mysql://localhost:3306/game_db
    username: root
    password: 123451
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

services:
  tic-tac-toe-engine:
    base-url:  http://localhost:8081/game-engine/tic-tac-toe-engine/api/v1
    endpoints:
      start-game: /start-game
      move: /make-move
      lobby: /lobby

  ludo-engine:
    base-url: http://localhost:8081/game-engine/ludo-engine/api/v1
    endpoints:
      start-game: /start-game
      move: /make-move
      roll-dice: /roll-dice
      lobby: /lobby

