spring:
  application:
    name: game-service

  datasource:
    url: jdbc:mysql://localhost:3306/game_db
    username: root
    password: 123451
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

services:
  tic-tac-toe-engine:
    base-url:  http://localhost:8081/game-engine
    endpoints:
      start-game: /api/v1/start-game
      move: /api/v1/make-move
      lobby: /api/v1/lobby

  ludo-engine:
    base-url: http://localhost:8082
    endpoints:
      start-game: /ludo-engine/api/v1/start-game
      move: /ludo-engine/api/v1/engine/process-move
      roll-dice: /ludo-engine/api/v1/engine/roll-dice

